<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" font-family="'JetBrains Mono','DejaVu Sans Mono','Cascadia Code',Consolas,monospace">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3fb950" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="t1"><rect x="34" y="92" width="0" height="26"><animate attributeName="width" values="0;360" dur="0.7s" begin="0.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="t3"><rect x="34" y="178" width="0" height="26"><animate attributeName="width" values="0;430" dur="0.9s" begin="2.0s" fill="freeze"/></rect></clipPath>
  </defs>

  <!-- window -->
  <rect x="1" y="1" width="818" height="298" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <rect x="1.5" y="1.5" width="817" height="42" rx="13" fill="#161b22"/>
  <rect x="1.5" y="30" width="817" height="14" fill="#161b22"/>
  <circle cx="26" cy="22" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="22" r="6" fill="#ffbd2e"/>
  <circle cx="70" cy="22" r="6" fill="#27c93f"/>
  <text x="410" y="27" fill="#8b949e" font-size="14" text-anchor="middle">the_python_lord — zsh</text>

  <!-- subtle scanline wash -->
  <rect x="2" y="44" width="816" height="254" fill="url(#scan)" opacity="0.6"/>

  <g font-size="20">
    <!-- L1: typed command -->
    <g clip-path="url(#t1)">
      <text x="34" y="111">
        <tspan fill="#3fb950">visitor@github</tspan><tspan fill="#8b949e"> : </tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#8b949e"> $ </tspan><tspan fill="#e6edf3">whoami</tspan>
      </text>
    </g>

    <!-- L2: output name -->
    <text x="34" y="149" font-size="24" font-weight="bold" fill="#3fb950" filter="url(#glow)" opacity="0">
      The Python Lord
      <animate attributeName="opacity" values="0;1" dur="0.25s" begin="1.2s" fill="freeze"/>
    </text>

    <!-- L3: typed command -->
    <g clip-path="url(#t3)">
      <text x="34" y="197">
        <tspan fill="#3fb950">visitor@github</tspan><tspan fill="#8b949e"> : </tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#8b949e"> $ </tspan><tspan fill="#e6edf3">cat role.txt</tspan>
      </text>
    </g>

    <!-- L4: output role -->
    <text x="34" y="235" fill="#c9d1d9" opacity="0">
      Infrastructure / Systems Engineer
      <animate attributeName="opacity" values="0;1" dur="0.25s" begin="3.0s" fill="freeze"/>
    </text>

    <!-- L5: prompt + blinking cursor -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.2s" begin="3.4s" fill="freeze"/>
      <text x="34" y="275">
        <tspan fill="#3fb950">visitor@github</tspan><tspan fill="#8b949e"> : </tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#8b949e"> $ </tspan>
      </text>
      <rect x="296" y="259" width="11" height="20" fill="#3fb950">
        <animate attributeName="opacity" values="1;1;0;0" dur="1s" begin="3.6s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
